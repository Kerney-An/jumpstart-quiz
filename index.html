<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jumpstart Personality Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <header>
            <h1>Find Your Jumpstart Deck</h1>

            <p>
                Rate each statement from 1–5 and we'll match you
                with two Magic: The Gathering Foundations Jumpstart themes.
            </p>
        </header>

        <form id="quiz-form">

            <div id="quiz-questions"></div>

            <button type="submit">
                Find My Packs
            </button>

        </form>

        <section id="results" class="hidden">

            <h2>Your Jumpstart Deck</h2>

            <div id="primary-result"></div>

            <div class="plus">+</div>

            <div id="secondary-result"></div>

            <section class="all-results">
                <h3>All Results</h3>
                <div id="all-results-list"></div>
            </section>

            <button id="restart-button" type="button">
                Take Quiz Again
            </button>

        </section>

    </main>

    <script type="module" src="js/quiz.js"></script>

</body>
</html>
